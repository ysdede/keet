name: Sync Demo to HF Space

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/sync-hf-space.yml'
  workflow_dispatch:
    inputs:
      space_id:
        description: 'Hugging Face Space ID to deploy'
        required: true
        default: 'ysdede/keet-streaming'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_SPACE_ID: ${{ github.event.inputs.space_id || 'ysdede/keet-streaming' }}

    steps:
      - name: Checkout keet
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: keet

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Checkout parakeet.js source
        run: git clone --depth 1 https://github.com/ysdede/parakeet.js.git parakeet.js

      - name: Install parakeet.js dependencies for local source build
        working-directory: parakeet.js
        run: npm install

      - name: Install keet dependencies
        working-directory: keet
        run: npm install

      - name: Build keet static assets
        working-directory: keet
        env:
          USE_LOCAL_PARAKEET: 'true'
          BASE_PATH: '/'
        run: npm run build

      - name: Create prebuilt HF static export
        working-directory: keet
        run: |
          rm -rf hf_export
          mkdir -p hf_export
          cp -r dist/* hf_export/
          touch hf_export/.nojekyll
          echo "{\"branch\": \"${GITHUB_REF_NAME}\", \"commit\": \"${GITHUB_SHA::7}\"}" > hf_export/git-info.json
          cat > hf_export/README.md <<'EOF'
          ---
          title: Keet Streaming
          emoji: 🎙️
          colorFrom: indigo
          colorTo: blue
          sdk: static
          pinned: false
          header: mini
          fullWidth: true
          app_file: index.html
          license: mit
          short_description: Real-time browser ASR with parakeet.js + WebGPU
          models:
          - ysdede/parakeet-tdt-0.6b-v2-onnx
          - ysdede/parakeet-tdt-0.6b-v3-onnx
          tags:
          - asr
          - speech-to-text
          - parakeet
          - parakeet-js
          - onnx
          - webgpu
          - wasm
          custom_headers:
            cross-origin-embedder-policy: require-corp
            cross-origin-opener-policy: same-origin
            cross-origin-resource-policy: cross-origin
          ---

          # Keet Streaming

          Keet is a real-time, privacy-first transcription app built with SolidJS + Vite and powered by `parakeet.js`.
          Inference runs in the browser (WebGPU/WASM) with no backend transcription service.

          This Space is deployed from prebuilt static files generated by GitHub Actions. Hugging Face does not run a build step.
          EOF

      - name: Push prebuilt static export to HF Space
        working-directory: keet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf upload "$HF_SPACE_ID" hf_export . \
            --repo-type=space \
            --delete '*' \
            --commit-message "Sync prebuilt static keet demo (${GITHUB_SHA::7})"
